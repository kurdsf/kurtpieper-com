    background: var(--bg);
    color: var(--text);
    font-family: Charter, Georgia, "Times New Roman", serif;

  .plot { width: min(60rem, 100%); margin: 0 auto; overflow-x: auto; }
  svg.chart { display: block; min-width: 44rem; width: 100%; height: auto; }
  svg.chart .wk:hover rect[fill="transparent"] { fill: var(--flag-soft); }
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 1.1rem; align-items: center;
    width: min(60rem, 100%); margin: 0 auto;
    font-size: .85rem; color: var(--muted);

  .legend span { display: inline-flex; align-items: center; gap: .4rem; }
  .legend i { width: .7rem; height: .7rem; border-radius: 2px; flex: none; }
  .legend i.evt { height: 0; width: .9rem; border-radius: 0; border-top: 2px dashed var(--flag); }
