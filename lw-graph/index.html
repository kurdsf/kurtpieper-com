<!DOCTYPE html>

<title>LessWrong output, April&ndash;July 2026 &mdash; Kurt Pieper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Weekly LessWrong words written, April to July 2026, with the GCP workshop and HAAISS marked.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --text: #222; --muted: #6b6b6b; --bg: #fdfdfb;
    --s1: #2a78d6; --s2: #eb6834;
    --grid: #e8e7e1; --axis: #c6c5be;
    --flag: #6b6b6b; --flag-soft: rgba(107,107,107,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e6e4df; --muted: #9a9a94; --bg: #151513;
      --s1: #3987e5; --s2: #d95926;
      --grid: #2b2b27; --axis: #3d3d38;
      --flag: #9a9a94; --flag-soft: rgba(154,154,148,.10);
    }
  }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .5rem;
    padding: 2rem 1.25rem;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--text);
    font-family: Charter, Georgia, "Times New Roman", serif;
    text-rendering: optimizeLegibility;
  }
  .plot { width: min(56rem, 100%); margin: 0 auto; overflow-x: auto; }
  svg.chart { display: block; min-width: 40rem; width: 100%; height: auto; }
  svg.chart .wk:hover rect[fill="transparent"] { fill: var(--flag-soft); }
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 1.1rem; align-items: center;
    width: min(56rem, 100%); margin: 0 auto;
    font-size: .85rem; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: .4rem; }
  .legend i { width: .7rem; height: .7rem; border-radius: 2px; flex: none; }
  .legend i.evt { height: 0; width: .9rem; border-radius: 0; border-top: 2px dashed var(--flag); }
</style>
</head>
